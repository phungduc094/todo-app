<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Simple Todo App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Todo List</h1>
        <p class="subtitle">Plan your day with clarity.</p>
      </header>

      <div class="input-row">
        <input id="todo-input" type="text" placeholder="Add a new todo" aria-label="Add a new todo" />
        <button id="add-btn">Add</button>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
